  <title id="s1t">Stage one: T against sin squared of half the release angle</title>
  <desc id="s1d">Eight measured periods plotted against x. A best line and the steepest and shallowest lines that still pass through every error bar are drawn through the five points below 22 degrees; the three points above it lie above the line, showing the curvature that makes them unusable.</desc>

  <style>
    .fg-grid   { stroke: currentColor; stroke-opacity: .13; stroke-width: 1; }
    .fg-frame  { fill: none; stroke: currentColor; stroke-opacity: .34; stroke-width: 1.2; }
    .fg-tick   { font-family: var(--praxis-mono, "IBM Plex Mono", ui-monospace, monospace);
                 font-size: 11px; fill: currentColor; fill-opacity: .72; }
    .fg-axis   { font-family: var(--praxis-mono, "IBM Plex Mono", ui-monospace, monospace);
                 font-size: 12px; fill: currentColor; fill-opacity: .85; }
    .fg-key    { font-family: var(--praxis-mono, "IBM Plex Mono", ui-monospace, monospace);
                 font-size: 11px; fill: currentColor; fill-opacity: .8; }

    .fg-bar    { stroke: currentColor; stroke-opacity: .6; stroke-width: 1.1; }
    .fg-dot    { fill: currentColor; fill-opacity: .95; stroke: none; }
    .fg-out    { stroke-opacity: .3; stroke-dasharray: 2 2; }
    .fg-dot-out{ fill: none; stroke: currentColor; stroke-opacity: .5; stroke-width: 1.3; }

    .fg-best   { stroke: #6fb6ff; stroke: var(--praxis-accent, #6fb6ff);
                 stroke-width: 2.2; fill: none; }
    .fg-edge   { stroke: #6fb6ff; stroke: var(--praxis-accent, #6fb6ff);
                 stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
  </style>

